[capture]
source = "windows-graphics-capture"
window_title_keyword = "梦幻西游"

[sampling]
normal_fps = 5.0

[output]
event_log = "runtime/events/inventory_events.jsonl"

[inventory_monitor]
# 连续 3 个分析帧结果一致才确认，避免动画、鼠标悬停和短时遮挡误报。
enabled = true
template_path = "assets/templates/inventory_open.png"
confirm_frames = 3
# 所有告警状态必须连续保持约 5 秒才允许告警；中途恢复即重新计时。
alert_confirm_seconds = 5.0
# 背包满载只在状态刚变为 full 时提醒；若频繁变化，仍至少间隔 5 分钟。
full_cooldown_seconds = 300
# 程序启动后给员工 10 秒打开背包；仍未打开则每 60 秒提醒一次。
closed_grace_seconds = 10
closed_reminder_seconds = 60
# 背包被其他窗口遮挡时每 2 分钟提醒一次。
invalid_reminder_seconds = 120
