[capture]
source = "video"
path = "recordings/demo.mp4"
device_index = 0
source_id = "obs"

[sampling]
normal_fps = 5.0
battle_fps = 10.0
burst_fps = 20.0
burst_duration_ms = 1500
queue_size = 120

[evidence]
pre_buffer_ms = 2000
post_buffer_ms = 3000
directory = "runtime/evidence"

[output]
event_log = "runtime/events/events.jsonl"
console = true

