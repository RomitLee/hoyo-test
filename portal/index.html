<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <meta name="description" content="麦皮网常用工具入口">
  <title>麦皮网 · 实用工具集合</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <main class="shell">
    <header class="nav">
      <a class="brand" href="/" aria-label="麦皮网首页">
        <span class="brand-mark">M</span>
        <span><strong>麦皮网</strong><small>MAIPI TOOLS</small></span>
      </a>
      <span class="nav-status"><i></i> 服务在线</span>
    </header>

    <section class="hero">
      <p class="eyebrow">ONE PLACE · THREE TOOLS</p>
      <h1>常用工具，<br><span>一个入口。</span></h1>
      <p class="lead">简洁、快速、随时可用。选择一个工具，现在开始。</p>
    </section>

    <section class="tool-grid" aria-label="麦皮网工具">
      <a class="tool-card gem" href="https://gem.maipi.top/">
        <div class="card-top">
          <span class="tool-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path d="M8 17 16 7h16l8 10-16 24L8 17Z"/><path d="m8 17 16 5 16-5M16 7l8 15 8-15M24 22v19"/></svg>
          </span>
          <span class="arrow">↗</span>
        </div>
        <div class="card-copy">
          <span class="number">01</span>
          <h2>宝石计算器</h2>
          <p>快速计算宝石合成、成本与数量。</p>
        </div>
        <span class="domain">gem.maipi.top</span>
      </a>

      <a class="tool-card mahjong" href="https://quan1.maipi.top/">
        <div class="card-top">
          <span class="tool-icon tile" aria-hidden="true">壹</span>
          <span class="arrow">↗</span>
        </div>
        <div class="card-copy">
          <span class="number">02</span>
          <h2>麻将积分记录</h2>
          <p>记录牌局积分，查看实时排名与战绩。</p>
        </div>
        <span class="domain">quan1.maipi.top</span>
      </a>

      <a class="tool-card monitor" href="https://jiankong.maipi.top/">
        <div class="card-top">
          <span class="tool-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48"><rect x="7" y="9" width="34" height="25" rx="5"/><path d="M18 41h12M24 34v7M13 25l6-6 5 4 9-9"/></svg>
          </span>
          <span class="arrow">↗</span>
        </div>
        <div class="card-copy">
          <span class="number">03</span>
          <h2>背包监控</h2>
          <p>远程查看从机、游戏窗口与背包告警。</p>
        </div>
        <span class="domain">jiankong.maipi.top</span>
      </a>
    </section>

    <footer>
      <span>© 2026 麦皮网</span>
      <span>简单工具，认真做好</span>
    </footer>
  </main>
</body>
</html>
